# ownership.yml — folder-level code ownership (source of truth; CODEOWNERS is generated from this)
# Maintained by the Architect together with the team. See TEAM.md for the working rules.
#
# owner:        agents | architect | shared | @github-handle
#               (architect = the planning agents: Architect, and Prototyper for .agentthon/artifacts/ui/)
# reviewers:    optional list of @handles requested on PRs touching this area
# change_rule:  optional free text for architect/shared areas
#
# Agents may only write to paths owned by `agents`. Most specific match wins.

areas:
  - path: ".agentthon/**"
    owner: architect
    change_rule: "Only via the Architect"

  - path: ".agentthon/evals/reports/**"
    owner: agents
    change_rule: "Eval reports written by the Foreman's eval tester"

  - path: "contracts/**"
    owner: architect
    change_rule: "Only via an Architect decision; all owners notified"

  - path: ".github/**, AGENTS.md, CLAUDE.md, TEAM.md"
    owner: architect
    change_rule: "Generated or team-wide; change via the Architect"

  # Application areas are added by the Architect after the stack and structure are decided.
